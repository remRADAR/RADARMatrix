<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10151c" />
    <title>Halo OS — Offline</title>
    <style>
      :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#10151c;color:#f5f6f8}
      *{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 70% 15%,#28404a,#10151c 55%)}
      main{max-width:34rem;padding:clamp(24px,6vw,48px);border:1px solid #51606a;border-radius:20px;background:#17212bd9}h1{margin:0 0 12px;font-size:clamp(28px,7vw,40px)}p{color:#c5cbd0;line-height:1.6}a{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:10px;background:#e6c77d;color:#17130b;text-decoration:none;font-weight:700}
    </style>
  </head>
  <body>
    <main>
      <h1>Halo is offline</h1>
      <p>The Halo app shell could not be opened from its cache. Reconnect once to load the workspace, then launch it again from your Home Screen.</p>
      <a href="/?screen=halo">Retry Halo</a>
    </main>
  </body>
</html>
