name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/matrix-console/package-lock.json

      - name: Install locked Matrix Console dependencies
        run: npm ci --prefix apps/matrix-console --ignore-scripts --no-audit --no-fund

      - name: Run foundation and routing tests
        run: npm test

      - name: Verify production fails closed when unconfigured
        run: npm run test:deployment

      - name: Typecheck Matrix Console
        run: npm run typecheck

      - name: Build Matrix Console
        run: npm run build:matrix-console

      - name: Smoke-test Matrix Console build and routes
        run: npm run test:matrix-console

      - name: Check whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^ )"
          fi
          git diff --check "$BASE_SHA" "$GITHUB_SHA"
