name: CI
# PR #25's fail-closed test accounting and OS scaffold checks are retained;
# Matrix IDE and reproducible console validations from PR #24 are included.
on:
  push:
    branches:
      - main
      - "architecture/**"
      - "security/**"
      - "runtime/**"
      - "stage-1/**"
      - "review/**"
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Repository, IDE, deployment and console checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/matrix-console/package-lock.json
      - name: Clean locked Matrix Console install
        run: npm ci --prefix apps/matrix-console --ignore-scripts --no-audit --no-fund
      - name: Run repository, IDE and OS scaffold tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          set -e
          echo "npm test exit code: $status"
          exit "$status"
      - name: Guard against swallowed failures
        shell: bash
        run: |
          MARKER=$(printf '\342\234\227')
          if grep -qE "^[[:space:]]*${MARKER} " /tmp/test.log; then
            echo "::error::Test output contains failure markers"
            exit 1
          fi
          echo "no swallowed failure markers found"
      - name: Assert fail-closed runner reported PASSED
        shell: bash
        run: |
          grep -q "RESULT: PASSED" /tmp/test.log || {
            echo "::error::Runner did not report RESULT: PASSED"
            exit 1
          }
      - name: Verify deployment fails closed when unconfigured
        run: npm run test:deployment
      - name: Typecheck Matrix Console
        run: npm run typecheck
      - name: Build Matrix Console
        run: npm run build:matrix-console
      - name: Smoke-test Matrix Console
        run: npm run test:matrix-console
      - name: Check whitespace errors
        run: git diff --check
  os-scaffold:
    name: RADAR OS script checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bash syntax check
        run: bash -n os/radar-os/scripts/*.sh os/radar-os/live/auto/config
      - name: OS scaffold regression tests
        run: npm run test:os-scaffold
      - name: State the boot-evidence boundary
        run: |
          echo "NOT RUN HERE: real ISO build and QEMU boot."
          echo "This job proves script behaviour only, not that an OS boots."
          echo "Real boot evidence is committed under os/radar-os/evidence/."
