name: CI

# Why this workflow exists: `main` carries only deploy-staging.yml (push to
# `staging`, no tests). This branch therefore had NO test workflow at all —
# PR #14's only check run was "Vercel Preview Comments", so the exit-code
# enforced suite had no automated consumer and its green appearance was not
# test evidence.
#
# Deliberately matches .github/workflows/ci.yml on the Stage 0.1.1 corrective
# lineage (#15 / architecture/stage-0-1-1-corrections-verified) — same Node
# version, same install step, same test commands — so results are comparable
# across the OS track and a red/green here means the same thing there.
#
# KNOWN LIMITATION, stated honestly rather than papered over:
# the test runner on THIS branch ends with an unconditional `process.exit(0)`
# (tests/test-runner.mjs line 43). A recorded suite failure does not by itself
# fail `npm test`, so the exit-code step alone would be vacuous here. The hard
# gate is therefore the failure-marker guard below, which inspects the suite
# OUTPUT for the U+2717 marker the suites print on every failed check. That
# guard is independent of the runner's exit status.
#
# #15 replaces the runner with a fail-closed one and adds a "RESULT: PASSED"
# assertion. Once #15 lands on top of this branch, the exit-code step becomes
# meaningful as well and this file can be replaced by #15's version wholesale.

on:
  push:
    branches:
      - main
      - "architecture/**"
      - "security/**"
      - "runtime/**"
      - "stage-1/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Matrix Console dependencies
        run: |
          if [ -f apps/matrix-console/package-lock.json ]; then
            npm ci --prefix apps/matrix-console --ignore-scripts --no-audit --no-fund
          else
            echo "no console lockfile on this ref; skipping install"
          fi

      - name: Run test suite (exit code enforced)
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          set -e
          echo "npm test exit code: $status"
          exit "$status"

      - name: Guard against swallowed failures
        shell: bash
        run: |
          # The failure marker is U+2717; the pass marker is U+2713. They are
          # adjacent codepoints, so a character class would match BOTH. Build
          # the exact codepoint from octal so this file stays pure ASCII.
          MARKER=$(printf '\342\234\227')
          if grep -qE "^[[:space:]]*${MARKER} " /tmp/test.log; then
            echo "::error::Test output contains failure markers"
            exit 1
          fi
          echo "no swallowed failure markers found"

      - name: Assert the suite actually executed
        shell: bash
        run: |
          # Guards the opposite failure mode: a crash before any assertion ran
          # produces no ✗ marker either, so the guard above would pass on an
          # empty log. "Test Run Complete" is only printed after every suite has
          # been invoked.
          grep -q "Test Run Complete" /tmp/test.log || {
            echo "::error::Runner did not report Test Run Complete"
            exit 1
          }
          echo "suite executed to completion"

      - name: Typecheck Matrix Console
        run: npm run typecheck

  os-scaffold:
    name: RADAR OS script checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bash syntax check
        run: bash -n os/radar-os/scripts/*.sh os/radar-os/live/auto/config

      - name: OS scaffold regression tests
        run: npm run test:os-scaffold

      - name: State the boot-evidence boundary
        run: |
          echo "NOT RUN HERE: real ISO build and QEMU boot."
          echo "This job proves script behaviour only, not that an OS boots."
          echo "Real boot evidence is committed under os/radar-os/evidence/."
